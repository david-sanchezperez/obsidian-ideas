services:
  obsidian-ideas:
    image: python:3.12-slim
    container_name: obsidian-ideas
    restart: unless-stopped
    working_dir: /app
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    environment:
      - HOME=/tmp
    volumes:
      - .:/app
      - ${VAULT_HOST_PATH}:/app/vault
    env_file:
      - .env
    command: >
      sh -c "pip install -q --user -r requirements.txt && python bot.py"
